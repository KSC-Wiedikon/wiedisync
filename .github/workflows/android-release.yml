name: Android release

# Builds the signed Android app (android/) and the club's F-Droid repo.
#
# Tag `android-vX.Y.Z` on a prod commit → GitHub release with the APK, and the
# F-Droid repo (every android-v* release APK) deployed to the `kscw-fdroid`
# Pages project, production branch → https://fdroid.kscw.ch.
#
# ONLY a tag on prod runs this (security review 2026-10-11, H9). The release
# signing key, the F-Droid repo key and the Pages token live in this workflow's
# secrets; the old `android-preview` branch trigger and the manual run handed
# all three to any ref that could be pushed. To rehearse, build locally:
# `cd android && ./gradlew assembleProdRelease` with the key from
# ~/.config/wiedisync-android/ (android/README.md → Signing), then
# `android/fdroid/build-repo.sh <dir-with-apks> android/fdroid/out` — that out
# dir is gitignored (its work/config.yml holds the repo key password).
#
# Release checklist: bump versionCode + versionName in android/app/build.gradle.kts,
# add android/fastlane/metadata/android/{en-US,de-DE}/changelogs/<versionCode>.txt,
# land it on prod, then `git tag android-vX.Y.Z origin/prod && git push origin android-vX.Y.Z`.

# Never pull_request / pull_request_target: the signing keys live in this
# workflow's secrets and the repo is public (same rule as deploy-cloudflare-pages.yml).
on:
  push:
    tags: ['android-v*']

# Read-only by default; only the job that creates the GitHub release may write.
permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  # The release key's certificate — a build signed with anything else must not ship.
  APP_CERT_SHA256: 0d79b074de19ffd087e2f556c56d09f93314e828d344fcf18501fbdcde9fe238
  BUILD_TOOLS: 35.0.0

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # gh release create
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release from prod only, tag must match versionName
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/prod \
            || { echo "::error::$GITHUB_REF_NAME is not on prod — releases ship from prod only"; exit 1; }
          NAME=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          [ "$GITHUB_REF_NAME" = "android-v$NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME does not match versionName $NAME"; exit 1; }

      - name: Version
        run: |
          echo "VERSION=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(sed -n 's/^ *versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;$BUILD_TOOLS" > /dev/null

      - name: Build the signed APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export ANDROID_KEYSTORE="$RUNNER_TEMP/release.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE"
          (cd android && ./gradlew --no-daemon assembleProdRelease)
          rm -f "$ANDROID_KEYSTORE"
          mkdir -p "$RUNNER_TEMP/apks"
          cp android/app/build/outputs/apk/prod/release/app-prod-release.apk "$RUNNER_TEMP/apks/wiedisync-$VERSION.apk"

      - name: Check the signature
        run: |
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/apks/wiedisync-$VERSION.apk" \
            | grep -q "SHA-256 digest: $APP_CERT_SHA256" \
            || { echo "::error::the APK is not signed with the Wiedisync release key"; exit 1; }

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          M=android/fastlane/metadata/android
          {
            cat "$M/en-US/changelogs/$VERSION_CODE.txt"; echo
            cat "$M/de-DE/changelogs/$VERSION_CODE.txt"; echo
            echo "Install and update through F-Droid: https://fdroid.kscw.ch"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/apks/wiedisync-$VERSION.apk" \
            --title "Wiedisync for Android $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Earlier releases (F-Droid keeps every version installable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName | select(startswith("android-v"))'); do
            # A rehearsal of an already released version keeps the fresh build.
            [ "$tag" = "android-v$VERSION" ] && continue
            gh release download "$tag" --pattern 'wiedisync-*.apk' --dir "$RUNNER_TEMP/apks" --skip-existing
          done
          ls -la "$RUNNER_TEMP/apks"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apks
          path: ${{ runner.temp }}/apks
          retention-days: 3

  fdroid-repo:
    needs: release
    runs-on: ubuntu-latest
    # Debian's fdroidserver: its androguard is patched for current APKs — the
    # PyPI one crashes on ours (resources.arsc / v3 signature block).
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - name: fdroidserver
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            fdroidserver apksigner openjdk-21-jre-headless git ca-certificates > /dev/null

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apks
          path: apks

      - name: Build the F-Droid repo
        env:
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_B64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          export FDROID_KEYSTORE="$RUNNER_TEMP/fdroid-repo.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$FDROID_KEYSTORE"
          android/fdroid/build-repo.sh apks "$RUNNER_TEMP/fdroid"
          rm -f "$FDROID_KEYSTORE"

      # Only the public site leaves this job — never the work dir with the config.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fdroid-site
          path: ${{ runner.temp }}/fdroid/site
          retention-days: 3

  deploy:
    needs: fdroid-repo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fdroid-site
          path: site

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 989cbb0f25ed3f11e417908694ef8da5
        run: |
          BRANCH=$([ "$GITHUB_REF_TYPE" = tag ] && echo main || echo preview)
          # Direct Upload project; created on the first run, a no-op afterwards.
          # Exact version: this step holds CLOUDFLARE_API_TOKEN, so it must not
          # pull whatever wrangler 4.x is newest at run time.
          npx wrangler@4.149.0 pages project create kscw-fdroid --production-branch main > /dev/null 2>&1 || true
          npx wrangler@4.149.0 pages deploy site --project-name kscw-fdroid --branch "$BRANCH" --commit-dirty=true
