name: Deploy backend (dev)

# Runs the same `npm run deploy:dev` chain a maintainer would run locally
# (db:snapshot -> db:migrate -> db:setup-perms -> db:smoke -> ext:deploy), on a
# runner that holds the Hetzner SSH key — so a dev deploy no longer needs a
# workstation with an unlocked vault.
#
# Prod is deliberately NOT here. directus/scripts/deploy-auth.sh sources the
# prod admin credentials from Vaultwarden via `rbw`, which needs a master
# password on a TTY. That human gate is the point: a runner would need its own
# copy of the prod admin password and the VPS key, doubling where the strongest
# credentials live. Dev is cheap to duplicate; prod is not. Deploy prod with
# deploy-auth.sh.
#
# Secrets live on the `dev` GitHub Environment:
#   HETZNER_SSH_KEY         private key for the deploy user
#   HETZNER_HOST            VPS hostname or IP
#   HETZNER_USER            SSH user (needs the sudo rights the scripts use)
#   ADMIN_EMAIL             Directus dev admin login, for db:setup-perms
#   ADMIN_PASSWORD          its password
#   SMOKE_TEST_TOKEN        non-admin Member token, for db:smoke
#
# Optional:
#   SMOKE_TEST_COACH_TOKEN  Coach token; db:smoke skips its coach checks without it
#
# setup-permissions.mjs authenticates by password, NOT by static token — the
# static token has no directus_roles access, so a token here fails at
# permission reconciliation. Same reasoning as deploy-auth.sh.

on:
  workflow_dispatch:

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          # deploy-extensions.sh resolves origin/dev, so it needs real history
          # and remote refs, not a single-commit shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HETZNER_HOST }}
          SSH_USER: ${{ secrets.HETZNER_USER }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_hetzner
          chmod 600 ~/.ssh/id_hetzner
          {
            echo "Host hetzner"
            echo "  HostName $SSH_HOST"
            echo "  User $SSH_USER"
            echo "  IdentityFile ~/.ssh/id_hetzner"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - run: npm ci

      - name: Deploy
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SMOKE_TEST_TOKEN: ${{ secrets.SMOKE_TEST_TOKEN }}
          SMOKE_TEST_COACH_TOKEN: ${{ secrets.SMOKE_TEST_COACH_TOKEN }}
        run: npm run deploy:dev
