name: Deploy to Cloudflare Pages (KSCW account)

# The KSCW-account Pages projects are Direct Upload — Cloudflare cannot attach a git
# repo to them, ever (a project is permanently either git-connected or Direct Upload).
# So push-to-deploy has to come from here instead of from Cloudflare's own build.

on:
  push:
    branches: [prod, dev]
  workflow_dispatch:

# Never pull_request / pull_request_target — both repos are PUBLIC and that would
# expose CLOUDFLARE_API_TOKEN and SENTRY_AUTH_TOKEN to fork PRs.

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: kscw-wiedisync
            script: build
          - project: kscw-spielplanung
            script: build:scheduling
    name: ${{ matrix.project }} (${{ github.ref_name }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # api.ts pins prod Directus by hostname, but the scheduling build needs these.
          VITE_DIRECTUS_URL: ${{ github.ref_name == 'prod' && 'https://directus.kscw.ch' || 'https://directus-dev.kscw.ch' }}
          VITE_SCHEDULING_ORIGIN: ${{ github.ref_name == 'prod' && 'https://spielplanung.wiedisync.kscw.ch' || 'https://spielplanung-dev.kscw.ch' }}
          VITE_FEATURE_MESSAGING: 'true'
          # Both ship inside the client bundle, so they are public either way — but
          # kept out of this public repo so key-scraping bots do not harvest them.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          # Inline on purpose. GitHub redacts every secret VALUE from the logs, so
          # SENTRY_PROJECT as a secret would replace the literal string "wiedisync"
          # with *** everywhere — repo name, paths, wrangler output — and make the
          # logs useless. Neither of these is sensitive.
          # Verified from a successful Cloudflare build log ("Organization: kscw /
          # Projects: wiedisync"). Do NOT infer the org from the sntrys_ token — that
          # gives 'aequitax', which sentry-cli rejects with "Project not found" → 403.
          # A failed upload does NOT fail this build: the plugin deletes the .map files
          # either way, so the only symptom is minified stack traces in Sentry.
          SENTRY_ORG: kscw
          SENTRY_PROJECT: wiedisync
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -o pipefail
          npm run ${{ matrix.script }} 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Warn if the Sentry upload failed
        # Deliberately a warning, not a failure: source maps are diagnostics, and a
        # Sentry outage must not block a deploy. But the plugin swallows upload errors
        # and the build stays green, so without this the only symptom is minified
        # stack traces nobody notices for weeks.
        if: always()
        run: |
          if grep -q '\[sentry-vite-plugin\] Error' "$RUNNER_TEMP/build.log" 2>/dev/null; then
            echo "::warning::Sentry source-map upload FAILED for ${{ matrix.project }} — stack traces for this release will stay minified. Check SENTRY_ORG (kscw) / SENTRY_PROJECT (wiedisync) / SENTRY_AUTH_TOKEN."
            grep -m3 -A2 '\[sentry-vite-plugin\] Error' "$RUNNER_TEMP/build.log" || true
          else
            echo "Sentry upload OK"
          fi

      - name: Refuse to publish sourcemaps
        # vite.config.ts sets `build.sourcemap: 'hidden'` unconditionally; the Sentry
        # plugin deletes the .map files ONLY when SENTRY_AUTH_TOKEN is set. A missing
        # or expired token therefore publishes the app's source, silently — it already
        # happened once (95 maps, 10.08.2026). Fail loudly instead.
        run: |
          count=$(find dist -name '*.map' -type f | wc -l)
          if [ "$count" -ne 0 ]; then
            echo "::error::$count sourcemap(s) still in dist/ — SENTRY_AUTH_TOKEN is missing or invalid, so the Sentry plugin never deleted them. Refusing to publish app source."
            find dist -name '*.map' -type f | head -20
            exit 1
          fi
          echo "OK — 0 sourcemaps in dist/"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # KSCW club account. Not a secret — it appears in every dashboard URL.
          CLOUDFLARE_ACCOUNT_ID: 989cbb0f25ed3f11e417908694ef8da5
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repo secret CLOUDFLARE_API_TOKEN is not set. It must be a KSCW-account token with Account · Cloudflare Pages · Edit."
            exit 1
          fi
          npx wrangler@4 pages deploy dist \
            --project-name='${{ matrix.project }}' \
            --branch='${{ github.ref_name }}' \
            --commit-hash='${{ github.sha }}'
