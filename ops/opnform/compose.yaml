# OpnForm (forms.kscw.ch) as a plain Compose project. It replaces the Coolify service
# g57v4frrpv7kz69s7aortpf0 on the move to the Infomaniak VPS (option A, decided 20.10.2026:
# Coolify and its Traefik are dropped).
#
# On the server: /opt/opnform/{compose.yaml, .env (0600, root), nginx/nginx.conf}
#   docker compose --project-directory /opt/opnform up -d
#   docker restart opnform-nginx   # after the api/ui containers were recreated (stale upstream IPs)
#
# Reached only through the kscw-club Cloudflare tunnel: forms.kscw.ch → http://127.0.0.1:8095.
# Nothing listens publicly.
#
# .env: written by make-env.sh from the live Coolify containers (never printed, never in git).
# The three api containers get all of it via env_file, as under Coolify; the others only what
# they need. Service names are Coolify's (opnform-api, opnform-ui, postgresql, redis, nginx),
# because nginx.conf, DB_HOST, REDIS_HOST and NUXT_PRIVATE_API_BASE address them by name.
# Container names are new and stable (opnform-*): backup-postgres.sh dumps opnform-postgres.
name: opnform

x-api: &api
  image: ghcr.io/lucanepa/opnform-api:kscw-776bafb5
  restart: unless-stopped
  env_file: .env
  volumes:
    - api-storage:/usr/share/nginx/html/storage
  depends_on:
    postgresql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  opnform-api:
    <<: *api
    container_name: opnform-api
    healthcheck:
      test: ["CMD-SHELL", "php /usr/share/nginx/html/artisan about || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  api-worker:
    <<: *api
    container_name: opnform-api-worker
    command: ["php", "artisan", "queue:work"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'php artisan queue:work' > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  api-scheduler:
    <<: *api
    container_name: opnform-api-scheduler
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "php /usr/share/nginx/html/artisan app:scheduler-status --mode=check --max-minutes=3 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 70s

  opnform-ui:
    image: ghcr.io/lucanepa/opnform-client:kscw-776bafb5
    container_name: opnform-ui
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL}
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE}
      NUXT_PRIVATE_API_BASE: ${NUXT_PRIVATE_API_BASE}
      NUXT_PUBLIC_ENV: ${NUXT_PUBLIC_ENV}
      NUXT_PUBLIC_H_CAPTCHA_SITE_KEY: ${NUXT_PUBLIC_H_CAPTCHA_SITE_KEY}
      NUXT_PUBLIC_RE_CAPTCHA_SITE_KEY: ${NUXT_PUBLIC_RE_CAPTCHA_SITE_KEY}
      H_CAPTCHA_SITE_KEY: ${H_CAPTCHA_SITE_KEY}
      RE_CAPTCHA_SITE_KEY: ${RE_CAPTCHA_SITE_KEY}
    depends_on:
      opnform-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://opnform-ui:3000/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  postgresql:
    image: postgres:16
    container_name: opnform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: redis:7
    container_name: opnform-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 30s
      retries: 3

  nginx:
    image: nginx:1.29.2
    container_name: opnform-nginx
    restart: unless-stopped
    command: ["sh", "-c", "echo 'client_max_body_size 64M;' > /etc/nginx/conf.d/zz-upload-size.conf && exec nginx -g 'daemon off;'"]
    ports:
      - "127.0.0.1:8095:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - opnform-api
      - opnform-ui
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  api-storage:
  postgres-data:
  redis-data:
