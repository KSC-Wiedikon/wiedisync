<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- The app is fully internationalized (de/en/fr/gsw/it) and sets the active
         locale itself. Browser auto-translation (iOS Safari etc.) is therefore
         redundant AND breaks React: it mutates text nodes out-of-band, so React's
         next commit throws "NotFoundError: The object can not be found here."
         (insertBefore). Opt out of it; <html lang> is kept in sync in src/i18n. -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/wiedisync_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Inter is self-hosted (public/fonts, @font-face in src/index.css). It used to
         be a Google Fonts <link> here, which contacted Google on every page view of an
         authenticated internal tool — including the login screen. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Wiedisync</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4A55A2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wiedisync" />
    <link rel="apple-touch-icon" href="/wiedisync_blau.png" />
    <script src="/sw-register.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
